<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPEED RACER</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#2a1414 0,#111 55%);color:#fff;font:16px/1.4 Arial,sans-serif;text-align:center;overflow-x:hidden}
main{position:relative;padding:24px 16px}
.lg{position:relative;width:min(340px,72vw);margin:-30px auto -24px;overflow:hidden;padding:36px}
.lg img{display:block;width:100%;filter:drop-shadow(0 0 18px rgba(227,52,42,.45));animation:in .9s cubic-bezier(.2,.9,.25,1.15) .45s both,glow 2.6s ease-in-out 1.6s infinite}
.lg:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out 1.4s infinite;mix-blend-mode:overlay}
.st{position:absolute;left:50%;height:6px;width:120%;margin-left:-60%;transform:translateX(-120%) skewX(-30deg);animation:st .8s cubic-bezier(.3,.8,.3,1) forwards}
.s1{top:30%;background:#E3342A;animation-delay:.05s}.s2{top:48%;height:3px;background:#fff;animation-delay:.15s}.s3{top:62%;background:#E3342A;height:3px;animation-delay:.25s}
.rd{height:3px;width:min(300px,70vw);margin:4px auto 0;background:repeating-linear-gradient(90deg,#E3342A 0 28px,transparent 28px 44px);background-size:44px 3px;animation:road .5s linear infinite,fade .6s 1.2s both;opacity:.8}
p{opacity:.8;font-style:italic;animation:up .6s 1.25s both}
a{display:block;margin:12px auto;width:260px;padding:16px;border-radius:12px;background:#E3342A;color:#fff;font-weight:700;text-decoration:none;animation:up .6s both;transition:transform .15s,box-shadow .15s}
a:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(227,52,42,.35)}
a:nth-of-type(1){animation-delay:1.4s}a:nth-of-type(2){animation-delay:1.5s}a:nth-of-type(3){animation-delay:1.6s}
a.k{background:#fff;color:#111}a.p{background:transparent;border:1.5px solid #fff;color:#fff}
@keyframes st{0%{transform:translateX(-120%) skewX(-30deg);opacity:1}70%{opacity:1}100%{transform:translateX(120%) skewX(-30deg);opacity:0}}
@keyframes in{from{transform:translateX(-70%) skewX(-18deg);opacity:0;filter:blur(6px)}60%{transform:translateX(4%) skewX(6deg);opacity:1}to{transform:none}}
@keyframes glow{50%{filter:drop-shadow(0 0 30px rgba(227,52,42,.8))}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes road{to{background-position:-44px 0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
